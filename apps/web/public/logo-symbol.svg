<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Infinite Radio symbol">
  <!-- A signal expanding through space: one point, three incomplete arcs, asymmetric gaps. -->
  <g stroke="#e6ecf4" stroke-width="2.4" stroke-linecap="round">
    <circle cx="24" cy="24" r="20.5" stroke-dasharray="66.2 62.6" transform="rotate(160 24 24)" opacity="0.55"/>
    <circle cx="24" cy="24" r="14.5" stroke-dasharray="63.2 27.9" transform="rotate(70 24 24)" opacity="0.75"/>
    <circle cx="24" cy="24" r="8.5" stroke-dasharray="30 23.4" transform="rotate(-30 24 24)"/>
  </g>
  <circle cx="24" cy="24" r="2.6" fill="#22d3ee"/>
</svg>
